# Minimal hueman configuration example.
#
# This file does NOT live inside hueman/: every user/machine brings its
# own (by convention next to the dotfiles repo it will theme, e.g.
# "~/dotfiles/theme/hueman.config.yaml") and passes it to the tool with
# `hueman --config <path>` (or via the HUEMAN_CONFIG variable, or by
# leaving it at ~/.config/hueman/config.yaml).
#
# There is no concept of "environment" and no folder convention: each
# target declares its explicit list of output files (`outputs`). If
# several machines/profiles share the same theme, just list all the
# paths there.

# Optional: variables to avoid repeating paths. `${repo}` is substituted only
# in each target's `outputs` and `skip_unless_path_exists`, and in `state_file`,
# `palette_dirs` and `template_dirs` (never in reload, post_apply, patch or
# templates). They can be overridden with `hueman --var repo=<path> ...`.
# vars:
#   repo: "~/dotfiles"
# Usage: outputs: ["${repo}/kitty/theme.conf"]

# Where to persist the name of the active palette.
state_file: "~/.config/hueman/current"

# Your own palettes, in addition to the 25 packaged in hueman/palettes/.
# If a custom palette has the same name as a packaged one, the custom one wins.
palette_dirs:
  - "~/dotfiles/theme/palettes.custom"

# Your own templates, for targets the tool does not ship by default.
template_dirs:
  - "~/dotfiles/theme/templates.custom"

# Policy when a `reload` or `post_apply` command exits with a code != 0:
#   warn  (default) - a warning is logged and `set` continues; exit 0.
#   error           - an error is logged, the remaining steps still run
#                     (best-effort) and `set` exits with 1.
# Each target can override it with its own `reload_failure`.
# Each command's exit code is always logged.
reload_failure: warn

# Optional (opt-in): publishes the active palette to the orphan branch
# `hueman-state` of your dotfiles repo's remote ({palette, revision} in
# hueman.state.yaml, a single commit rewritten with force-with-lease). hueman
# uses its own repo (by default under $XDG_STATE_HOME/hueman/state-sync/) and
# never touches your working tree. Without a remote, network or git, `set`
# applies locally and warns.
# `set --dry-run` and `set --only` never write or push state.
# state_sync:
#   type: git                 # git (default) | file
#   repo: "~/dotfiles"        # repo the remote URL is taken from
#   remote: origin            # default
#   branch: hueman-state      # default
#   # workdir: "~/.local/state/hueman/state-sync/x.git"   # optional
#   # timeout: 15            # seconds per git call (default 15)
#
# Alternative without git: a state file in a folder that another tool already
# syncs (Syncthing, Dropbox...). Atomic write; the highest revision wins. If
# the folder does not exist it is treated as unreachable (it is not created).
# state_sync:
#   type: file
#   path: "~/Sync/hueman.state.yaml"

targets:
  # --- "overwrite" example: replaces the whole file.
  kitty:
    template: kitty.conf.j2
    palette_key: kitty
    mode: overwrite
    outputs:
      - "~/.config/kitty/theme.conf"
    reload: "pgrep -x kitty >/dev/null 2>&1 && pkill -USR1 -x kitty || true"
    # reload_failure: error   # optional override of the global policy

  # --- "patch" example: regex splice on an existing file, leaving the rest
  # of its content untouched (useful for hand-written configs, such as the
  # starship prompt).
  starship:
    template: starship_block.toml.j2
    palette_key: polybar
    mode: patch
    patch:
      marker_regex: '# --- Bloque gestionado por (?:theme_manager\.py|hueman).*?\[palettes\.dotfiles\][^\[]*'
      replacements:
        - ['style = "bold green"', 'style = "bold success"']
      ensure_after:
        - if_missing_regex: '(?m)^palette\s*='
          anchor: "add_newline = false\n"
          insert: "palette = \"dotfiles\"\n"
    outputs:
      - "~/.config/starship.toml"

  # --- Example of optional guards: `skip_if_missing_parent` skips an output
  # whose parent directory does not exist; `skip_unless_path_exists` (path or
  # list) skips the WHOLE target (no write, no reload) unless all of those
  # paths exist, useful for "only if tool X is installed".
  # windhawk_taskbar:
  #   template: windhawk_taskbar.json.j2
  #   palette_key: polybar
  #   skip_if_missing_parent: true
  #   skip_unless_path_exists: "/mnt/c/Windows/System32/schtasks.exe"
  #   outputs: ["/mnt/c/Users/ME/AppData/Local/DotfilesTheme/taskbar-colors.json"]

  # --- YASB and Flow Launcher (Windows, from WSL). They require `win_home` in
  # `vars` (e.g. "/mnt/c/Users/ME"). YASB: `patch` only replaces the
  # `:root { ... }` block of its styles.css (it does not create the file; YASB
  # reloads on its own). Flow Launcher: its own Hueman.xaml theme; pick it once
  # in Settings > Appearance, and reselect it to see changes.
  # yasb_theme:
  #   template: yasb_root.css.j2
  #   palette_key: polybar
  #   extra_vars:
  #     border_active: kitty.active_border_color
  #     border_inactive: kitty.inactive_border_color
  #   mode: patch
  #   outputs: ["${win_home}/.config/yasb/styles.css"]
  #   skip_unless_path_exists: "${win_home}/.config/yasb/styles.css"
  #   patch:
  #     strategy: regex_splice
  #     marker_regex: ':root\s*\{.*?\}'
  #
  # flowlauncher_theme:
  #   template: flowlauncher_theme.xaml.j2
  #   palette_key: polybar
  #   extra_vars:
  #     border_active: kitty.active_border_color
  #   mode: overwrite
  #   outputs: ["${win_home}/AppData/Roaming/FlowLauncher/Themes/Hueman.xaml"]
  #   skip_unless_path_exists: "${win_home}/AppData/Roaming/FlowLauncher/Themes"

  # --- Telegram cloud theme (Android). Renders an .attheme and the reload
  # uploads it with the example script `examples/telegram/telegram-theme-sync`
  # (copy it to a path of your own; it needs Telethon separately, see its
  # README). It only runs if the session exists, in the background and with a
  # timeout so it does not block.
  # telegram_theme:
  #   template: telegram.attheme.j2
  #   palette_key: polybar
  #   extra_vars:
  #     bg0h: kitty.color0
  #     bg2: kitty.inactive_border_color
  #     blu: kitty.color12
  #     pur: kitty.color13
  #     aqu: kitty.color14
  #   mode: overwrite
  #   outputs: ["~/.local/share/hueman/telegram/current.attheme"]
  #   reload: "[ -f ~/.config/hueman/telegram.session ] && (timeout 60 ~/.local/bin/telegram-theme-sync ~/.local/share/hueman/telegram/current.attheme >/dev/null 2>&1 &) || true"

# Commands that run once at the end of `set`, not per target.
# They do not run when `set --only ...` is used (partial re-render).
# `reload` and `post_apply` commands accept placeholders: `{name}`
# (or `{palette}`) and `{section.key}` (lookup in the active palette, e.g.
# `{kitty.color4}`); they are substituted already shell-quoted. `${VAR}` is
# left alone and a dotted key that does not exist is an error.
post_apply:
  # - "python3 ~/x.py --name {name} --color {kitty.color4}"
  - "command -v oh-my-posh >/dev/null 2>&1 && oh-my-posh enable reload || true"
